# INFI TV — CI (FASE 21)
# Lint, typecheck, tests y build en cada push/PR a main o develop.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    name: Backend (lint + typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @infitv/types -w @infitv/utils
      - run: npx prisma generate
        working-directory: backend
      - run: npm run lint -w infitv-backend
      - run: npm run typecheck -w infitv-backend
      - run: npm test -w infitv-backend

  admin:
    name: Admin (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @infitv/types -w @infitv/utils
      - run: npm run lint -w infitv-admin
      - run: npm run build -w infitv-admin

  mobile:
    name: Mobile (expo-doctor + typecheck + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @infitv/types -w @infitv/utils
      - run: npx expo-doctor
        working-directory: apps/mobile
      - run: npm run typecheck -w infitv-mobile
      - run: npm run lint -w infitv-mobile
