# INFI TV — Docker Compose (FASE 19)
# Dev y producción (VPS). Redis es opcional (§38) pero queda previsto.
# Nginx expone 80/443 y proxya /api -> backend y / -> admin.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: infitv
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infitv-dev}
      POSTGRES_DB: infitv
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432" # dev local (el host ya usa 5433); en VPS se puede omitir
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infitv"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://infitv:${POSTGRES_PASSWORD:-infitv-dev}@postgres:5432/infitv?schema=public
      JWT_SECRET: ${JWT_SECRET:?}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?}
      CODE_PEPPER: ${CODE_PEPPER:?}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      REDIS_URL: redis://redis:6379
      IPTV_SOURCE_URL: ${IPTV_SOURCE_URL:-https://iptv-org.github.io/iptv/index.m3u}
      EPG_SOURCE_URL: ${EPG_SOURCE_URL:-}
      IPTV_SYNC_ENABLED: ${IPTV_SYNC_ENABLED:-false}
      EPG_SYNC_ENABLED: ${EPG_SYNC_ENABLED:-false}
      ABUSE_MAX_FAILURES: ${ABUSE_MAX_FAILURES:-10}
      ABUSE_WINDOW_MS: ${ABUSE_WINDOW_MS:-900000}
      ABUSE_BLOCK_MS: ${ABUSE_BLOCK_MS:-1800000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "3000"

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    depends_on:
      - backend
    expose:
      - "3001"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - admin

volumes:
  pgdata:
  redisdata:
